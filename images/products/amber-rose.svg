<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a4a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c98a4a" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9cd82"/>
      <stop offset="50%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#8c6d2f"/>
    </linearGradient>
  </defs>

  <!-- cap -->
  <rect x="120" y="30" width="60" height="42" rx="6" fill="url(#cap)"/>
  <rect x="128" y="18" width="44" height="18" rx="4" fill="url(#cap)"/>

  <!-- neck -->
  <rect x="138" y="66" width="24" height="26" fill="#d8cfb8" opacity="0.5"/>

  <!-- bottle body -->
  <rect x="90" y="90" width="120" height="230" rx="18" fill="url(#liquid)" stroke="#c9a24b" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="90" y="90" width="120" height="230" rx="18" fill="url(#glass)"/>

  <!-- label -->
  <rect x="108" y="190" width="84" height="56" rx="3" fill="#f5efe2" opacity="0.92"/>
  <line x1="120" y1="208" x2="180" y2="208" stroke="#8c6d2f" stroke-width="1"/>
  <line x1="126" y1="222" x2="174" y2="222" stroke="#8c6d2f" stroke-width="1"/>
  <circle cx="150" cy="234" r="3" fill="#c9a24b"/>

  <!-- base shadow -->
  <ellipse cx="150" cy="332" rx="70" ry="12" fill="#000000" opacity="0.35"/>
</svg>
